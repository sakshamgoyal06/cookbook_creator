name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cookbook
          POSTGRES_PASSWORD: cookbook
          POSTGRES_DB: cookbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cookbook"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # tests/test_database.py also runs every migration test against this database.
      TEST_POSTGRES_URL: postgresql://cookbook:cookbook@localhost:5432/cookbook_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install WeasyPrint system libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: flake8 --max-line-length=120 --exclude=__pycache__,instance,uploads,outputs,.git app.py config.py models/ services/ tests/ migrations/ scripts/
      - name: Test
        run: pytest -q
