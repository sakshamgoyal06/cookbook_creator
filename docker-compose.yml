# Local Postgres and Redis for development: `make db-up`, then set
# DATABASE_URL=postgresql://cookbook:cookbook@localhost:5432/cookbook in .env
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cookbook
      POSTGRES_PASSWORD: cookbook
      POSTGRES_DB: cookbook
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookbook"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
