{% extends "public/_listen_base.html" %}
{% block title %}{{ recipe.recipe_title }}{% endblock %}
{% block content %}
<p class="eyebrow">{{ recipe.project_title }}</p>
<h1>{{ recipe.recipe_title }}</h1>
<p class="meta">Recorded {{ recipe.clips[0].created_at.strftime('%-d %B %Y') if recipe.clips[0].created_at else '' }}</p>
<button class="play" id="play" aria-label="Play the recording">&#9654;</button>
<p class="status" id="status" aria-live="polite"></p>
<audio id="audio" preload="none"></audio>
<script>
(function () {
    var urls = {{ clip_urls | tojson }}, clips = urls.length, current = 1, counted = false;
    var audio = document.getElementById("audio"), button = document.getElementById("play"),
        status = document.getElementById("status");
    function load(n) { current = n; audio.src = urls[n - 1]; }
    button.addEventListener("click", function () {
        if (!audio.src) load(1);
        if (audio.paused) { audio.play(); } else { audio.pause(); }
    });
    audio.addEventListener("play", function () {
        button.innerHTML = "&#10074;&#10074;"; button.setAttribute("aria-label", "Pause");
        status.textContent = clips > 1 ? "Part " + current + " of " + clips : "";
        if (!counted) { counted = true; navigator.sendBeacon && navigator.sendBeacon({{ played_url | tojson }}); }
    });
    audio.addEventListener("pause", function () {
        button.innerHTML = "&#9654;"; button.setAttribute("aria-label", "Play the recording");
    });
    audio.addEventListener("ended", function () {
        if (current < clips) { load(current + 1); audio.play(); } else { load(1); status.textContent = ""; }
    });
    audio.addEventListener("error", function () { status.textContent = "Couldn't load the recording. Try again."; });
})();
</script>
{% endblock %}
