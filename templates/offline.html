{% extends "base.html" %}
{% block title %}Offline - {{ config.APP_NAME }}{% endblock %}
{% block content %}
<div class="card">
    <h1>You're offline</h1>
    <p>{{ config.APP_NAME }} needs an internet connection. Check your connection and try again.</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Try again</a>
</div>
{% endblock %}
