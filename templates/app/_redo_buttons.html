<a class="btn btn-secondary btn-block" href="{{ url_for('screens.record', project_id=project.id, kind='replace', recipe=recipe.id) }}">{{ icon('mic') }} Record it again</a>
<a class="btn btn-secondary btn-block" href="{{ url_for('screens.import_notes', project_id=project.id, replace=recipe.id) }}">{{ icon('upload') }} Upload a voice note instead</a>
<form method="post" action="{{ url_for('screens.delete_recipe', project_id=project.id, recipe_id=recipe.id) }}" data-confirm="Delete “{{ recipe.recipe_title }}” and its voice notes? This can't be undone.">{{ csrf() }}<button class="btn btn-danger btn-block" type="submit">Delete this recipe</button></form>
