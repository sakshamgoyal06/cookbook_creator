{% extends "app/_shell.html" %}
{% from "components/ui.html" import csrf %}
{% block content %}
<h1>Whose recipes are we saving?</h1>
<p class="muted">You can change this later.</p>
<form method="post" class="stack">
  {{ csrf() }}
  <label class="choice"><input type="radio" name="cook_mode" value="whatsapp" required>
    <span class="card"><strong>Someone in the family, on WhatsApp</strong><br><span class="muted">Mummy, Nani, Papa, anyone. They talk in voice notes the way they always do; you add the notes here.</span></span></label>
  <label class="choice"><input type="radio" name="cook_mode" value="assisted">
    <span class="card"><strong>Someone in the family, I'll record them</strong><br><span class="muted">Cook together and record them on your phone.</span></span></label>
  <label class="choice"><input type="radio" name="cook_mode" value="self">
    <span class="card"><strong>My own recipes</strong><br><span class="muted">You're the cook. Record your recipes for your family.</span></span></label>
  <button class="btn btn-primary btn-block" type="submit">Continue</button>
</form>
{% endblock %}
