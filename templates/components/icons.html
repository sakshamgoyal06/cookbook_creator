{# Simple stroke icons (24x24). Usage: {{ icon('mic') }} #}
{% macro icon(name, label=None) -%}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
     {% if label %}role="img" aria-label="{{ label }}"{% else %}aria-hidden="true"{% endif %}>
{%- if name == 'mic' -%}<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>
{%- elif name == 'play' -%}<path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="none"/>
{%- elif name == 'pause' -%}<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/>
{%- elif name == 'stop' -%}<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/>
{%- elif name == 'home' -%}<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>
{%- elif name == 'book' -%}<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>
{%- elif name == 'list' -%}<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>
{%- elif name == 'users' -%}<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14a6 6 0 0 1 3.5 6"/>
{%- elif name == 'pot' -%}<path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M2 10h20"/><path d="M9 6c0-1.5 1-1.5 1-3M14 6c0-1.5 1-1.5 1-3"/>
{%- elif name == 'back' -%}<path d="M15 5l-7 7 7 7"/>
{%- elif name == 'share' -%}<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/>
{%- elif name == 'qr' -%}<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v1M14 20h1M17 17h4v4"/>
{%- elif name == 'upload' -%}<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v4h16v-4"/>
{%- elif name == 'check' -%}<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == 'phone' -%}<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>
{%- elif name == 'plus' -%}<path d="M12 5v14M5 12h14"/>
{%- elif name == 'up' -%}<path d="M6 15l6-6 6 6"/>
{%- elif name == 'down' -%}<path d="M6 9l6 6 6-6"/>
{%- elif name == 'x' -%}<path d="M6 6l12 12M18 6L6 18"/>
{%- endif -%}
</svg>
{%- endmacro %}
