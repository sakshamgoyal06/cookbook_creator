{% extends "base.html" %}

{% block title %}Login – Mom's Cookbook Studio{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Sign In</h1>
    <form method="POST" class="auth-form">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>

    {% if config.GOOGLE_CLIENT_ID %}
    <div class="auth-divider"><span>or</span></div>
    <a href="{{ url_for('login_google') }}" class="btn btn-google btn-full">Sign in with Google</a>
    {% endif %}

    <p class="auth-link">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
</div>
{% endblock %}
