{% extends "app/_shell.html" %}
{% from "components/ui.html" import csrf %}
{% block title %}Sign in · {{ config.APP_NAME }}{% endblock %}
{% block content %}
<h1>Welcome back</h1>
<form method="POST">
  {{ csrf() }}
  <label for="email">Email</label>
  <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
  <label for="password">Password</label>
  <input type="password" id="password" name="password" required autocomplete="current-password">
  <div class="actions"><button type="submit" class="btn btn-primary btn-block">Sign in</button>
  {% if config.GOOGLE_CLIENT_ID %}<a href="{{ url_for('login_google') }}" class="btn btn-secondary btn-block">Sign in with Google</a>{% endif %}</div>
</form>
<p class="center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}
